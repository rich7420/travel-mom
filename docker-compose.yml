services:
  travel-desk:
    build: .
    env_file: .env
    environment:
      TRAVEL_DESK_DB: /data/travel_desk.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - travel-desk-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  travel-desk-data:
